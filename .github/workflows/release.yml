name: Release GitToy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release VSIX
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore .\Gittoy.csproj

      - name: Build
        run: dotnet build .\Gittoy.csproj --configuration Release --no-restore

      - name: Find VSIX
        id: vsix
        shell: pwsh
        run: |
          $vsix = Get-ChildItem `
            -Path . `
            -Filter *.vsix `
            -Recurse |
            Select-Object -First 1

          if (-not $vsix) {
              Write-Error "VSIX package not found."
              exit 1
          }

          Write-Host "VSIX found:"
          Write-Host $vsix.FullName

          "path=$($vsix.FullName)" >> $env:GITHUB_OUTPUT

      - name: Rename VSIX
        id: rename
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")

          $source = "${{ steps.vsix.outputs.path }}"
          $target = Join-Path (Split-Path $source) "Gittoy-$version.vsix"

          Move-Item $source $target

          Write-Host "VSIX: $target"

          "path=$target" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.rename.outputs.path }}

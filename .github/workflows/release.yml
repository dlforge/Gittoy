name: Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. 恢复依赖
      - name: Restore
        run: dotnet restore Gittoy.sln

      # 4. 编译
      - name: Build
        run: dotnet build Gittoy.sln --configuration Release --no-restore

      # 5. 查找 VSIX
      - name: Find VSIX
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter *.vsix -Recurse |
            Select-Object FullName

      # 6. 创建 GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.vsix
          generate_release_notes: true
